name: Vista
options:
  bundleIdPrefix: dev.vista
  deploymentTarget:
    iOS: "17.0"

packages:
  VistaCore:
    path: ../core

targets:
  Vista:
    type: application
    platform: iOS
    sources:
      - path: Vista
    dependencies:
      - package: VistaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vista.client
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Vista connects to your paired Linux host on the local network."
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        CODE_SIGN_STYLE: Automatic
