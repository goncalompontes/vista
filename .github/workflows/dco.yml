name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sign-off:
    name: Every commit is signed off
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_REF"
          base="origin/$BASE_REF"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              subject="$(git log -1 --format=%s "$sha")"
              echo "::error::Commit $sha (\"$subject\") has no Signed-off-by trailer"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base..HEAD")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Every commit in this pull request must carry a Developer Certificate of Origin sign-off."
            echo "Fix it with: git rebase --signoff $base && git push --force-with-lease"
            echo "See CONTRIBUTING.md for the policy."
            exit 1
          fi
          echo "All commits are signed off."
