name: Portable client checks

on:
  push:
    paths:
      - "client/core/**"
      - "client/android/**"
      - ".github/workflows/client-portable.yml"
  pull_request:
    paths:
      - "client/core/**"
      - "client/android/**"
      - ".github/workflows/client-portable.yml"

permissions:
  contents: read

concurrency:
  group: portable-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android build and wire tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK and run JVM wire tests
        working-directory: client/android/Android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

  swift-core-linux:
    name: VistaCore tests (Linux, Swift 6.0)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run portable package tests on Linux
        run: swift test --package-path client/core
