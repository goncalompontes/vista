[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-computer-use"
version = "0.1.0"
description = "MCP server for Vista's vphone/QEMU computer-use workflow"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vista-computer-use-mcp = "vista_computer_use.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
