[package]
name = "vista-host"
version = "0.1.0"
edition = "2024"
description = "Native Linux host for Vista remote applications"

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "tokio"] }
enumflags2 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
